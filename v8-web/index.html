<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>伴行 V8 · 办公助手</title><link rel="stylesheet" href="/product.css"><link rel="stylesheet" href="/app.css"><script src="/app.js" defer></script></head>
<body class="grok-ui product-ui">
<aside class="sidebar" id="sidebar"><div class="sidebar-tools"><button class="icon-button" id="search-toggle" aria-label="搜索对话"><svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg></button><button class="icon-button" id="new-chat" aria-label="新建对话"><svg viewBox="0 0 24 24"><path d="M12 4v16M4 12h16"/></svg></button></div><a class="brand" href="/"><span class="brand-symbol" aria-hidden="true"><i></i><i></i></span><span>伴行 V8<small>你的办公助手</small></span></a><input id="search" type="search" placeholder="搜索对话" aria-label="搜索历史对话" hidden><nav id="threads" aria-label="历史对话"></nav><div class="sidebar-bottom"><span class="connection-dot"></span><span>公司内网运行<small>文件与成果保存在本机</small></span></div></aside>
<div class="app-shell"><header class="grok-header"><button id="mobile-menu" class="icon-button" aria-label="展开对话列表"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button><div class="agent-chip"><span class="small-symbol" aria-hidden="true">▰</span>伴行 V8</div><button class="health" id="health" aria-label="检查公司内网连接"><span class="connection-dot"></span><span id="health-text">检查内网连接…</span></button></header>
<main id="chat-main"><section id="conversation" aria-label="对话内容" aria-live="polite"></section></main>
<div class="composer-wrap"><div class="composer" id="composer"><div id="current-result" hidden></div><details id="materials-panel" hidden><summary id="materials-summary">本对话材料</summary><div id="materials"></div><p class="material-help">勾选的原件供本轮读取；不勾选不会删除原件。当前成果可独立继续修改。</p></details><div id="upload-status" class="upload-status" role="status"></div><form id="chat-form"><button id="add-files" class="attach-button" type="button" aria-label="添加文件"><svg viewBox="0 0 24 24"><path d="M12 4v16M4 12h16"/></svg></button><label class="visually-hidden" for="message">给伴行发消息</label><textarea id="message" rows="1" maxlength="12500" placeholder="给伴行发消息，或上传文件交办任务"></textarea><button id="send" type="submit" aria-label="发送消息"><svg viewBox="0 0 24 24"><path d="M12 20V4m-6 6 6-6 6 6"/></svg></button><button id="stop" type="button" hidden>停止</button></form><input id="file-input" type="file" multiple hidden accept=".txt,.md,.json,.csv,.log,.pdf,.xlsx,.png,.jpg,.jpeg,.wav,.mp3,.m4a,.flac,.ogg,.py,.js,.mjs,.ts"><p id="form-error" class="form-error" role="alert"></p></div><p class="composer-note">内网 Qwen 27B · 原件保留，修改另存新版本 · 文件回读不等于内容已核实</p></div></div>
<dialog id="delete-dialog"><h2>删除这个对话？</h2><p>它将从列表中移除。原运行证据保留在本机。</p><div class="dialog-actions"><button id="delete-cancel">取消</button><button id="delete-confirm" class="danger">删除对话</button></div></dialog>
</body></html>
