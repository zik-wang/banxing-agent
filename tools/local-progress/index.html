<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Codex · 任务看板</title><link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script></head><body><a class="skip" href="#tasks">跳到任务</a><main><header><div><p class="eyebrow">LOCAL OPERATIONS / 仅本机</p><h1>任务进度看板</h1><p>窗口身份固定，任务关联随进度变化。各会话继续在原窗口工作。</p></div><button id="refresh">立即刷新</button></header><p id="connection" role="status" aria-live="polite">正在连接本地上报服务…</p><div id="stats" class="stats"></div><aside id="inspection"></aside><section aria-label="窗口进度"><h2>窗口进度 · 可跨多个任务</h2><div id="sessions" class="sessiongrid"></div></section><section aria-label="任务" id="tasks" class="grid"></section><section aria-label="跨任务及待归类"><h2>跨任务 / 待归类</h2><div id="unclassified" class="grid"></div></section><section class="milestones"><h2>里程碑 · 时间待确认</h2><ul id="milestones"></ul></section><details id="demo"><summary>演示区 · 模拟 worker，独立于真实任务</summary><div class="grid" id="demos"></div></details><footer>各任务分别计算 30 分钟上报时效；窗口在做另一项任务，不会刷新旧任务的时间。服务可用不代表 worker 正在运行。worker 汇报完成与用户验收分别记录。<br>只存状态、简短结论和允许记录的路径；禁止上传材料正文、合同、凭证及敏感数据。时间统一显示为 Asia/Shanghai。</footer></main></body></html>
